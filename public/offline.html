<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — Pulso</title>
    <style>
      /*
        Página de respaldo del service worker. Es un archivo estático: se sirve
        sin el pipeline de Next, así que Geist entra por su nombre de familia y
        cae a system-ui si el usuario abre esto en frío y la fuente no está en
        caché. Los valores replican los tokens de DESIGN.md a mano porque aquí
        no hay Tailwind ni globals.css — si esos tokens cambian, este archivo
        es el que hay que tocar.
      */
      :root {
        color-scheme: light dark;
        --fondo: #ffffff;
        --texto: #1a1a1a;
        --suave: #6b7280;
        --borde: #e5e7eb;
        /* Operational Red: oklch(0.52 0.17 25) de globals.css. */
        --rojo: #b63132;
        /* rounded.lg y rounded.md de DESIGN.md. */
        --radio-lg: 0.625rem;
        --radio-md: 0.375rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #0b0b0c;
          --texto: #f5f5f5;
          --suave: #9ca3af;
          --borde: #27272a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--fondo);
        color: var(--texto);
        font-family: Geist, system-ui, sans-serif;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      .caja { max-width: 22rem; text-align: center; }
      img {
        width: 4rem;
        height: 4rem;
        border-radius: var(--radio-lg);
      }
      /* Title: 600, clamp(1rem, 2vw, 1.25rem), 1.3 */
      h1 {
        font-size: clamp(1rem, 2vw, 1.25rem);
        font-weight: 600;
        line-height: 1.3;
        margin: 1.25rem 0 0.5rem;
      }
      /* Body: 400, 0.875rem, 1.5 */
      p {
        color: var(--suave);
        font-size: 0.875rem;
        text-wrap: pretty;
        margin: 0 0 1.25rem;
      }
      /* Label: 500, 0.75rem. Alto mínimo 44px por objetivo táctil. */
      button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 1px solid transparent;
        border-radius: var(--radio-md);
        background: var(--rojo);
        color: #ffffff;
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        cursor: pointer;
      }
      button:hover { opacity: 0.92; }
      button:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="caja">
      <img src="/icon-192.png" alt="Pulso" />
      <h1>Sin conexión</h1>
      <p>
        No pudimos cargar esta pantalla. Los datos de operación se muestran solo en vivo,
        así que no guardamos una copia vieja que podría engañarte.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
